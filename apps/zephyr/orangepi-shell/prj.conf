CONFIG_AXIVC=y
CONFIG_AXIVC_FALLBACK_POLL_MS=100
# Keep Zephyr's runtime physical-map window away from the image linked at
# 0x50000000. AXIVC maps the guest shared-memory GPA into this window.
CONFIG_KERNEL_VM_BASE=0x40000000
CONFIG_KERNEL_VM_SIZE=0x08000000
CONFIG_CPP=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_THREAD_STACK_INFO=y
# Allow Ctrl+C during shell_readline while a workload is active.
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_PROMPT_UART="zephyr:~$ "

# Built-in inspection commands shared by IVC and AKA shell builds.
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
