# Zephyr guest image for the Orange Pi 5 Plus Linux + StarryOS + Zephyr
# three-guest functional test (`zephyr-triple-guest-functional`).
#
# The TGOSImages `orangepi-5-plus` target (`orangepi_5_plus_rk3588`) provides the
# NS16550 UART and the ARM arch timer; the guest pins the word-only UART access
# mode used by the virtual console.
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM64_VA_BITS_40=y
CONFIG_ARM64_PA_BITS_40=y
CONFIG_SERIAL=y
CONFIG_UART_NS16550=y
CONFIG_UART_NS16550_ACCESS_WORD_ONLY=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_ARMV8_A_NS=y
CONFIG_CACHE_MANAGEMENT=y

CONFIG_PRINTK=y
CONFIG_ASSERT=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_SMP=n
CONFIG_MAIN_STACK_SIZE=4096

# The three-guest functional checks match the prompt verbatim, so it must stay
# `zephyr:~$ `.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="zephyr:~$ "
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
